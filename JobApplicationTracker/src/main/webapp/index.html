<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Job Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0f172a,#1d4ed8,#06b6d4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px;

}

.container{

width:900px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);
padding:40px;
border-radius:20px;
box-shadow:0 20px 45px rgba(0,0,0,.35);
border:1px solid rgba(255,255,255,.2);

}

h1{

text-align:center;
color:white;
margin-bottom:8px;
font-size:34px;

}

p{

text-align:center;
color:#dbeafe;
margin-bottom:35px;

}

.form-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:22px;

}

.form-group{

display:flex;
flex-direction:column;

}

label{

color:white;
font-weight:500;
margin-bottom:8px;

}

input,
select{

padding:14px;
border:none;
border-radius:12px;
background:rgba(255,255,255,.92);
font-size:15px;
transition:.3s;

}

input:focus,
select:focus{

outline:none;
transform:scale(1.02);
box-shadow:0 0 12px #38bdf8;

}

.button{

margin-top:35px;
text-align:center;

}

button{

padding:15px 45px;
font-size:17px;
border:none;
border-radius:50px;
cursor:pointer;
font-weight:600;
background:linear-gradient(135deg,#2563eb,#06b6d4);
color:white;
transition:.3s;

}

button:hover{

transform:translateY(-3px);
box-shadow:0 12px 25px rgba(0,0,0,.35);

}

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

.container{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<h1>💼 Smart Job Tracker</h1>

<p>Track all your job applications in one place.</p>

<form action="SmartJobTracker" method="post">

<div class="form-grid">

<div class="form-group">
<label>🏢 Company Name</label>
<input type="text" name="companyName" required>
</div>

<div class="form-group">
<label>💻 Job Role</label>
<input type="text" name="jobRole" required>
</div>

<div class="form-group">
<label>📅 Applied Date</label>
<input type="date" name="appliedDate" required>
</div>

<div class="form-group">
<label>📌 Application Status</label>
<select name="status">
<option>Applied</option>
<option>Assessment</option>
<option>Interview Scheduled</option>
<option>Interview Completed</option>
<option>HR Round</option>
<option>Offer Received</option>
<option>Rejected</option>
<option>On Hold</option>
</select>
</div>

<div class="form-group">
<label>📄 Resume Used</label>
<input type="text" name="resumeUsed" placeholder="Java Resume v3">
</div>

<div class="form-group">
<label>🌐 Job Portal</label>
<select name="portal">
<option>LinkedIn</option>
<option>Naukri</option>
<option>Indeed</option>
<option>Company Career Page</option>
<option>Referral</option>
<option>Internshala</option>
<option>Other</option>
</select>
</div>

<div class="form-group">
<label>📍 Job Location</label>
<input type="text" name="location">
</div>

<div class="form-group">
<label>💰 Salary / CTC</label>
<input type="text" name="salary">
</div>

</div>

<div class="button">
<button type="submit">🚀 Save Application</button>
</div>

</form>

</div>

</body>
</html>
